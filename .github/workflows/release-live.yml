name: Release FlaxMCP-Live

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: The tag must be the project version
        run: tools/check_version.sh "${GITHUB_REF_NAME}"
      - name: Build and test
        run: |
          dotnet restore FlaxMcp.slnx
          dotnet build FlaxMcp.slnx --configuration Release --no-restore
          dotnet test FlaxMcp.slnx --configuration Release --no-build
      - name: Pack
        run: dotnet pack src/FlaxMcp/FlaxMcp.csproj --configuration Release --no-build --output artifacts
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \[" v "\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" artifacts/*.nupkg --title "FlaxMCP-Live ${GITHUB_REF_NAME#v}" --notes-file notes.md $prerelease
