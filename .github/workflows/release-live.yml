name: Release FlaxMCP-Live

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: The tag must be the project version
        run: tools/check_version.sh "${GITHUB_REF_NAME}"
      - name: Build and test
        run: |
          dotnet restore FlaxMcp.slnx
          dotnet build FlaxMcp.slnx --configuration Release --no-restore
          dotnet test FlaxMcp.slnx --configuration Release --no-build
      - name: Pack
        run: dotnet pack src/FlaxMcp/FlaxMcp.csproj --configuration Release --no-build --output artifacts
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A literal match: as a regex, "[1.0.0]" is a bracket expression and misses the heading.
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > section.md
          # GitHub shows a line break in a release text as a break: join each wrapped bullet into one line.
          sed -e ':a' -e 'N' -e '$!ba' -e 's/\n  \+/ /g' section.md > notes.md
          test -s notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          # No assets: the public repository offers no archive downloads. The pack step above checks that the package builds.
          gh release create "${GITHUB_REF_NAME}" --title "FlaxMCP-Live ${GITHUB_REF_NAME#v}" --notes-file notes.md $prerelease
