name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    if: github.repository == 'eXoz00rd/FlaxMCP'  # FlaxMCP-Live releases with release-live.yml
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Sync server.json version
        run: |
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' src/FlaxMcp/.mcp/server.json > "$tmp"
          mv "$tmp" src/FlaxMcp/.mcp/server.json
      - name: Build
        run: dotnet build FlaxMcp.slnx --configuration Release -p:Version=${{ env.VERSION }}
      - name: Test
        run: dotnet test FlaxMcp.slnx --configuration Release --no-build
      - name: Pack
        run: dotnet pack src/FlaxMcp --configuration Release --no-build --output artifacts -p:Version=${{ env.VERSION }}
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: eXoz0rd
      - name: Push to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
