name: Quality

# Gates only the files FlaxMCP-Live added since the fork point (tools/quality.py): analyzers, complexity, coverage.
# Upstream's files keep upstream's rules, so upstream changes merge without new findings.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch upstream for the fork point
        run: |
          git remote add upstream https://github.com/eXoz00rd/FlaxMCP.git
          git fetch upstream main --no-tags
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install lizard
        run: pip install lizard==1.17.31
      - name: Quality gate
        run: python3 tools/quality.py
